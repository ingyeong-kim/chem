<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김인경 | 계산화학</title>
<meta name="description" content="계산화학 연구자 김인경의 웹사이트. 양자화학 계산과 분자동역학으로 반도체 공정가스와 소재의 반응을 예측합니다. Ingyeong Kim, computational chemist.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F3F5F9;--surface:#FFFFFF;--ink:#16202E;--ink-2:#4A5568;--ink-3:#7A8699;
  --line:#D5DBE5;--accent:#5338D6;--accent-soft:#E7E2FB;--ref:#9AA5B6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151F;--surface:#171E2B;--ink:#E8ECF3;--ink-2:#AEB7C6;--ink-3:#7D889B;
    --line:#2A3445;--accent:#9C8CFF;--accent-soft:#2A2550;--ref:#5D6879;
  }
}
:root[data-theme="dark"]{
  --bg:#10151F;--surface:#171E2B;--ink:#E8ECF3;--ink-2:#AEB7C6;--ink-3:#7D889B;
  --line:#2A3445;--accent:#9C8CFF;--accent-soft:#2A2550;--ref:#5D6879;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:17px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;
}
a{color:inherit}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
h1:focus{outline:none}
.wrap{max-width:1040px;margin:0 auto;padding-left:24px;padding-right:24px;width:100%}
sub,sup{font-size:.72em;line-height:0}
main{flex:1}

/* nav */
.nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.nav .me{font-weight:800;text-decoration:none;letter-spacing:-.02em;font-size:18px;white-space:nowrap}
.nav .me span{font-weight:500;color:var(--ink-3);font-size:14px;margin-left:8px;letter-spacing:0}
.nav ul{display:flex;gap:6px;list-style:none;font-size:15px}
.nav ul a{text-decoration:none;color:var(--ink-2);padding:6px 12px;border-radius:6px}
.nav ul a:hover{color:var(--ink);background:var(--surface)}
.nav ul a[aria-current="page"]{color:var(--accent);font-weight:600;background:var(--accent-soft)}

/* common */
.page{padding-top:56px;padding-bottom:96px}
.page-title{font-size:clamp(32px,5vw,44px);font-weight:800;letter-spacing:-.035em;line-height:1.2}
.page-sub{color:var(--ink-2);margin-top:10px;max-width:40em}
h2{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.4}
.crumb{font-size:14px;color:var(--ink-3);margin-bottom:18px}
.crumb a{text-decoration:none;color:var(--ink-2)}
.crumb a:hover{color:var(--accent);text-decoration:underline}
.crumb .sep{margin:0 8px;color:var(--line)}
.chip{display:inline-block;font-size:13px;padding:3px 10px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.chip.line{background:none;border:1px solid var(--line);color:var(--ink-2);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:8px;text-decoration:none;font-weight:600;font-size:15px;border:1.5px solid var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary:hover{background:var(--accent);color:#fff}
.chev{flex:none;width:20px;height:20px;color:var(--ink-3);transition:transform .15s}

/* home hero */
.hero{padding-top:72px}
.hero h1{font-size:clamp(44px,7vw,72px);font-weight:800;letter-spacing:-.04em;line-height:1.05}
.hero .en{display:block;font-size:clamp(17px,2vw,22px);font-weight:500;letter-spacing:0;color:var(--ink-3);margin-top:12px}
.hero .lead{font-size:clamp(22px,2.8vw,30px);font-weight:700;letter-spacing:-.025em;margin-top:28px;max-width:26em;line-height:1.45}
.hero .sub{color:var(--ink-2);margin-top:18px;max-width:38em}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.pes{margin-top:48px;width:100%;height:auto;display:block}
.pes .curve{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round}
.pes .axis{stroke:var(--line);stroke-width:1.5}
.pes .guide{stroke:var(--ref);stroke-width:1;stroke-dasharray:4 5}
.pes .pt{fill:var(--bg);stroke:var(--accent);stroke-width:2}
.pes text{fill:var(--ink-3);font-size:13px;font-family:inherit}
.pes .lbl{fill:var(--ink);font-weight:600;font-size:14px}
.pes .trail{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;opacity:0;pointer-events:none}
.pes .pt,.pes .lbl,.pes .guide{opacity:0;transition:opacity .45s ease}
.pes .on{opacity:1}
.pes .pt{transform-box:fill-box;transform-origin:center;transition:opacity .45s ease,transform .3s ease,fill .3s ease}
.pes .pt.hit{transform:scale(1.7);fill:var(--accent)}
.pes .mover{fill:var(--accent);opacity:0}
.pes .halo{fill:var(--accent);opacity:0}
.pes.static .pt,.pes.static .lbl,.pes.static .guide{opacity:1}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:8px}
.facts a{padding:20px 16px 18px 0;text-decoration:none;display:block}
.facts a+a{padding-left:20px;border-left:1px solid var(--line)}
.facts a:hover b{color:var(--accent)}
.facts b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.facts span{font-size:17px;color:var(--ink-2);line-height:1.5;display:block;margin-top:2px}

.home-sec{margin-top:80px}
.home-sec .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px}
.home-sec .head a{font-size:15px;color:var(--ink-2);text-decoration:none;font-weight:500}
.home-sec .head a:hover{color:var(--accent)}
.feature{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feature a{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;text-decoration:none;transition:border-color .15s}
.feature a:hover{border-color:var(--accent)}
.feature a:hover .chev{transform:translateX(3px);color:var(--accent)}
.feature .k{font-size:13px;color:var(--ink-3)}
.feature h3{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.4;margin-top:6px}
.feature p{font-size:15px;color:var(--ink-2);margin-top:8px;flex:1}
.fmeta{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin-top:14px;flex:1;align-content:start}
.fmeta dt{color:var(--ink-3);white-space:nowrap}
.fmeta dd{color:var(--ink-2)}
.feature .big{font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--accent);margin-top:16px;line-height:1.1}
.feature .big small{display:block;font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-top:4px}
.feature .foot{display:flex;justify-content:flex-end;margin-top:14px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:36px;overflow-x:auto}
.tabs a{padding:12px 16px;text-decoration:none;color:var(--ink-2);font-weight:600;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}
.tabs .n{font-weight:500;color:var(--ink-3);margin-left:4px;font-size:14px}

/* list rows */
.rows{list-style:none;margin-top:8px}
.rows > li{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:96px 1fr 24px;gap:20px;align-items:start;padding:22px 8px 22px 0;text-decoration:none}
.row:hover .r-title{color:var(--accent)}
.row:hover .chev{transform:translateX(3px);color:var(--accent)}
.row .yr{font-size:14px;color:var(--ink-3);padding-top:3px}
.r-title{font-weight:600;font-size:18px;line-height:1.5;letter-spacing:-.01em}
.r-meta{font-size:14px;color:var(--ink-2);margin-top:4px}
.r-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;min-width:0}
.r-tags .chip{white-space:normal}
.row > span{min-width:0}
.row .chev{margin-top:4px}
.group-h{font-size:15px;font-weight:700;color:var(--ink-3);margin-top:44px;padding-bottom:10px;border-bottom:1px solid var(--line)}

/* talks (expandable) */
details.talk{border-bottom:1px solid var(--line)}
details.talk summary{list-style:none;display:grid;grid-template-columns:96px 1fr auto 24px;gap:20px;align-items:start;padding:20px 8px 20px 0;cursor:pointer}
details.talk summary::-webkit-details-marker{display:none}
details.talk summary:hover .r-title{color:var(--accent)}
details.talk .chev{transform:rotate(90deg);margin-top:4px}
details.talk[open] .chev{transform:rotate(-90deg)}
details.talk .body{padding:0 32px 24px 116px;color:var(--ink-2);font-size:16px}
details.talk .body p+p{margin-top:8px}
details.talk .body .lab{color:var(--accent);font-weight:600;margin-right:6px}

/* detail pages */
.d-head{padding-bottom:28px;border-bottom:1px solid var(--line)}
.d-title{font-size:clamp(26px,3.6vw,36px);font-weight:800;letter-spacing:-.03em;line-height:1.3;max-width:28em}
.d-meta{margin-top:14px;color:var(--ink-2);font-size:15px}
.d-meta b{color:var(--ink);font-weight:600}
.authors{margin-top:10px;font-size:15px;color:var(--ink-2)}
.authors strong{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.d-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.d-grid{display:grid;grid-template-columns:1fr 280px;gap:56px;margin-top:40px}
.d-grid > *{min-width:0}
.d-body section+section{margin-top:44px}
.d-body h2{margin-bottom:12px}
.d-body p{color:var(--ink-2)}
.d-body p+p{margin-top:10px}
.d-body ul.dots{list-style:none;color:var(--ink-2)}
.d-body ul.dots li{position:relative;padding-left:16px;margin-top:8px}
.d-body ul.dots li::before{content:"";position:absolute;left:0;top:.75em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.d-body strong{color:var(--ink);font-weight:600}
.role-box{background:var(--accent-soft);border-radius:10px;padding:20px 22px}
.role-box h2{font-size:18px;color:var(--accent);margin-bottom:8px}
.role-box ul.dots{color:var(--ink)}
.steps{list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 18px 44px;color:var(--ink-2)}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.steps li::after{content:"";position:absolute;left:14px;top:32px;bottom:4px;width:1.5px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps li b{color:var(--ink);display:block;font-weight:600}
.formula{margin-top:14px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:17px;text-align:center;color:var(--ink);font-style:italic}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.kpi div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.25}
.kpi span{font-size:13px;color:var(--ink-2)}
.bars{margin-top:16px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.bars .cap{font-size:14px;color:var(--ink-2);margin-bottom:10px}
.bar{display:grid;grid-template-columns:84px 1fr 56px;align-items:center;gap:12px;font-size:14px;margin-top:8px;color:var(--ink-2)}
.bar .track{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.bar.ref .fill{background:var(--ref)}
.bar.dim .fill{background:color-mix(in srgb,var(--accent) 40%,var(--bg))}
.bar b{font-weight:700;text-align:right;color:var(--ink)}
.tline{list-style:none;margin-top:8px;border-left:2px solid var(--line);padding-left:18px}
.tline li{position:relative;padding:6px 0;color:var(--ink-2);font-size:15px}
.tline li::before{content:"";position:absolute;left:-24px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.tline b{color:var(--ink);display:inline-block;min-width:84px;font-weight:600}
table.data{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.data th,table.data td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line)}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data thead th{color:var(--ink-3);font-weight:600;background:var(--bg)}
table.data tr:last-child td{border-bottom:none}
.tblwrap{overflow-x:auto}
.note{font-size:14px;color:var(--ink-3);margin-top:10px}
.aside{font-size:14px}
.aside .box{border-top:2px solid var(--ink);padding-top:14px}
.aside .box+.box{margin-top:28px}
.aside h3{font-size:14px;color:var(--ink-3);font-weight:600;margin-bottom:8px}
.aside dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;color:var(--ink-2)}
.aside dt{color:var(--ink-3)}
.aside dd{color:var(--ink)}
.aside ul{list-style:none}
.aside li+li{margin-top:10px}
.aside li a{color:var(--ink);text-decoration:none;font-weight:500;line-height:1.5;display:block}
.aside li a:hover{color:var(--accent);text-decoration:underline}
.aside li small{display:block;color:var(--ink-3)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:64px;border-top:1px solid var(--line);padding-top:24px}
.pager a{text-decoration:none;display:block;padding:4px 0}
.pager a small{display:block;color:var(--ink-3);font-size:13px}
.pager a span{font-weight:600;line-height:1.5}
.pager a:hover span{color:var(--accent)}
.pager .next{text-align:right}

/* about */
.about-grid{display:grid;grid-template-columns:200px 1fr;gap:12px 40px;margin-top:48px}
.about-grid > h2{font-size:18px;padding-top:18px;border-top:2px solid var(--ink)}
.about-grid > div{border-top:1px solid var(--line);padding-top:18px;margin-bottom:28px}
.tl{list-style:none}
.tl li{display:grid;grid-template-columns:150px 1fr;gap:16px}
.tl li+li{margin-top:16px}
.tl .when{font-size:14px;color:var(--ink-3);padding-top:2px}
.tl b{font-weight:700}
.tl p{font-size:15px;color:var(--ink-2);margin-top:2px}
.skillset{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;font-size:16px}
.skillset dt{font-size:14px;color:var(--ink-3);padding-top:2px}

footer{border-top:1px solid var(--line);padding:32px 0 40px;font-size:14px;color:var(--ink-3)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--ink-2)}

@media (max-width:880px){
  .feature{grid-template-columns:1fr}
  .d-grid{grid-template-columns:1fr;gap:40px}
  .facts{grid-template-columns:repeat(2,1fr)}
  .facts a:nth-child(3){padding-left:0;border-left:none}
  .facts a:nth-child(n+3){border-top:1px solid var(--line)}
  .about-grid{grid-template-columns:1fr;gap:0}
  .about-grid > h2{border-top:none;padding-top:0}
  .about-grid > div{border-top:none;padding-top:10px;margin-bottom:36px}
}
@media (max-width:600px){
  body{font-size:16px}
  .wrap{padding-left:16px;padding-right:16px}
  .nav .me span:not(.nm){display:none}
  .nav ul a{padding:6px 7px}
  .navr{gap:8px}
  .nav .me .nm{font-size:16px}
  .page{padding-top:36px}
  .hero{padding-top:44px}
  .row{grid-template-columns:1fr 20px;gap:6px 12px}
  .row .yr{grid-column:1/-1;padding-top:0}
  .row .yr br{display:none}
  .row .chev{grid-column:2;grid-row:2}
  details.talk summary{grid-template-columns:1fr 20px;gap:6px 12px}
  details.talk summary .yr{grid-column:1/-1}
  details.talk summary .tagc{grid-column:1;grid-row:3}
  details.talk summary .chev{grid-column:2;grid-row:2}
  details.talk .body{padding:0 0 20px 0}
  .tl li,.skillset{grid-template-columns:1fr;gap:2px}
  .skillset dd{margin-bottom:10px}
  .pager{grid-template-columns:1fr}
  .pager .next{text-align:left}
  .bar{grid-template-columns:70px 1fr 46px}
  .pes text{font-size:16px}.pes .lbl{font-size:17px}
}
.nav .me .nm{font-size:18px;font-weight:800;color:var(--ink);margin:0;letter-spacing:-.02em}
.navr{display:flex;align-items:center;gap:14px}
.lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.lang button{font:inherit;font-size:13px;font-weight:600;padding:5px 9px;border:0;background:none;color:var(--ink-3);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button:hover:not([aria-pressed="true"]){color:var(--ink)}
</style>
</head>
<body>

<nav class="nav" id="topnav">
  <div class="wrap">
    <a class="me" href="#/"><span class="nm" data-u="name"></span><span data-u="field"></span></a>
    <div class="navr">
      <ul>
        <li><a href="#/research" data-nav="research" data-u="navResearch"></a></li>
        <li><a href="#/about" data-nav="about" data-u="navAbout"></a></li>
      </ul>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ko">KO</button><button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </div>
</nav>

<main id="app" tabindex="-1"></main>

<footer>
  <div class="wrap">
    <span data-u="footer"></span>
    <span><!-- TODO: 실제 이메일 주소로 바꾸기 --><a href="mailto:your.email@example.com" data-u="mail"></a>&nbsp;&nbsp;&nbsp;<a href="https://github.com/ingyeong-kim" target="_blank" rel="noopener">GitHub</a></span>
  </div>
</footer>

<script>
/* ===== language ===== */
let LANG = "ko";
try { const s = localStorage.getItem("lang"); if (s === "en" || s === "ko") LANG = s; } catch (e) {}
const t = x => (x && typeof x === "object" && !Array.isArray(x) && "k" in x) ? (LANG === "en" ? x.e : x.k) : x;
const tl = a => (a || []).map(t);

const U = {
  name:{k:"김인경",e:"Ingyeong Kim"},
  field:{k:"Computational Chemistry",e:"Computational Chemistry"},
  navResearch:{k:"연구",e:"Research"}, navAbout:{k:"소개",e:"About"},
  footer:{k:"© 2026 김인경. 2026년 10월 업데이트.",e:"© 2026 Ingyeong Kim. Updated October 2026."},
  mail:{k:"메일",e:"Email"},
  heroEn:{k:"Ingyeong Kim, M.S. in Physical Chemistry",e:"M.S. in Physical Chemistry, Catholic University of Korea"},

/* ===== helpers ===== */
const $app = document.getElementById("app");
const byId = (arr,id) => arr.find(x=>x.id===id);
const allPapers = () => [...PAPERS, THESIS];
const plain = s => String(s).replace(/<[^>]+>/g,"");
const authorsHTML = a => a.map(n => n===ME ? `<strong>${n}</strong>` : n).join(", ");
const tagsHTML = (tg,cls="line") => tl(tg).map(x=>`<span class="chip ${cls}">${x}</span>`).join("");

function researchHead(cur){
  const tabs = [["papers","#/research",t(U.tabPapers),PAPERS.length+1],["projects","#/research/projects",t(U.tabProjects),PROJECTS.length],["talks","#/research/talks",t(U.tabTalks),TALKS.length]];
  return `<h1 class="page-title" tabindex="-1">${t(U.resTitle)}</h1>
  <p class="page-sub">${t(U.resSub)}</p>
  <nav class="tabs" aria-label="${t(U.tabsAria)}">${tabs.map(([k,h,l,n])=>`<a href="${h}" ${k===cur?'aria-current="page"':''}>${l}<span class="n">${n}</span></a>`).join("")}</nav>`;
}
function paperRow(p){
  return `<li><a class="row" href="#/paper/${p.id}"><span class="yr">${p.date}</span>
    <span><span class="r-title" style="display:block">${t(p.title)}</span>
      <span class="r-meta" style="display:block">${t(p.journal)} ${t(p.cite)}</span>
      <span class="r-tags">${tagsHTML(p.tags)}</span></span>${CHEV}</a></li>`;
}
function projectRow(p){

/* ===== energy profile animation ===== */
let pesRAF = 0;
function initPES(){
  cancelAnimationFrame(pesRAF);
  const svg = $app.querySelector(".pes"); if(!svg) return;
  const path = svg.querySelector(".curve"), trail = svg.querySelector(".trail");
  const mover = svg.querySelector(".mover"), halo = svg.querySelector(".halo");
  const L = path.getTotalLength();
  const pts = [...svg.querySelectorAll(".pt")];
  const stopAt = pts.map(c => { const cx = +c.getAttribute("cx"); let best=0, bd=1e9;
    for(let l=0;l<=L;l+=2){ const q=path.getPointAtLength(l); const d=Math.abs(q.x-cx); if(d<bd){bd=d;best=l;} } return best; });
  const reveal = i => svg.querySelectorAll(`[data-i="${i}"]`).forEach(el=>el.classList.add("on"));
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ svg.classList.add("static"); return; }
  path.style.strokeDasharray = L; path.style.strokeDashoffset = L;
  const SEG = 90; trail.style.strokeDasharray = `${SEG} ${L+SEG}`;
  const DRAW = 3200, TRAVEL = 4200, PAUSE = 1600;
  const ease = x => x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;
  const place = (l, a) => { const q = path.getPointAtLength(Math.max(0,Math.min(L,l)));
    mover.setAttribute("cx",q.x); mover.setAttribute("cy",q.y); halo.setAttribute("cx",q.x); halo.setAttribute("cy",q.y);
    mover.style.opacity = a; halo.style.opacity = a*.18; };
  const t0 = performance.now() + 300;
  function frame(now){
    const e = now - t0;
    if (e < 0){ pesRAF = requestAnimationFrame(frame); return; }
    let l, a = 1;
    if (e < DRAW){
      l = ease(e/DRAW) * L;
      path.style.strokeDashoffset = L - l;
      trail.style.opacity = 0;
    } else {
      path.style.strokeDashoffset = 0;
      const c = (e - DRAW) % (TRAVEL + PAUSE);
      if (c > TRAVEL){ place(L, 0); trail.style.opacity = 0; pts.forEach(p=>p.classList.remove("hit")); pesRAF = requestAnimationFrame(frame); return; }
      l = ease(c/TRAVEL) * L;
      a = Math.min(1, c/300, (TRAVEL-c)/300);
      trail.style.opacity = .22*a;
      trail.style.strokeDashoffset = -(l - SEG);
    }
    place(l, a);
    stopAt.forEach((s,i) => { if (l >= s - 1) reveal(i); pts[i].classList.toggle("hit", Math.abs(l - s) < 14); });
    pesRAF = requestAnimationFrame(frame);
  }
  pesRAF = requestAnimationFrame(frame);
}

function applyChrome(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-u]").forEach(el => { el.innerHTML = t(U[el.dataset.u]); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===LANG ? "true" : "false"));
  document.getElementById("topnav").setAttribute("aria-label", LANG==="en" ? "Main menu" : "주요 메뉴");
}
function render(keepScroll){
  const raw = location.hash.replace(/^#/,"") || "/";
  const [path, qs] = raw.split("?");
  const parts = path.split("/").filter(Boolean);
  const q = new URLSearchParams(qs||"");
  let html, title = t(U.tHome), nav = "";
  const sfx = t(U.tSuffix);
  if(!parts.length){ html = Home(); }
  else if(parts[0]==="research"){
    nav = "research";
    if(parts[1]==="projects"){ html = Projects(); title = plain(t(U.tabProjects))+sfx; }
    else if(parts[1]==="talks"){ html = Talks(q.get("open")); title = plain(t(U.tabTalks))+sfx; }
    else { html = Papers(); title = plain(t(U.tabPapers))+sfx; }
  }
  else if(parts[0]==="paper"){ const r = Paper(parts[1]); nav="research"; if(r){html=r.html; title=r.title+sfx;} }
  else if(parts[0]==="project"){ const r = Project(parts[1]); nav="research"; if(r){html=r.html; title=r.title+sfx;} }
  else if(parts[0]==="about"){ html = About(); nav="about"; title=plain(t(U.aboutTitle))+sfx; }
  if(!html){ html = Home(); nav=""; }
  applyChrome();
  $app.innerHTML = html;
  initPES();
  document.title = title;
  document.querySelectorAll("[data-nav]").forEach(a=>{ a.dataset.nav===nav ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"); });
  if(keepScroll) return;
  const openId = q.get("open");
  if(openId){ const el = document.getElementById("talk-"+openId); if(el){ el.scrollIntoView({block:"center"}); return; } }
  window.scrollTo(0,0);
  const h = $app.querySelector("h1"); if(h) h.focus({preventScroll:true});
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  if (LANG === b.dataset.lang) return;
  LANG = b.dataset.lang;
  try { localStorage.setItem("lang", LANG); } catch (e) {}
  render(true);
}));
window.addEventListener("hashchange", () => render(false));
render(false);
</script>
</body>
</html>
